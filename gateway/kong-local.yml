_format_version: "3.0"
_transform: true

# Kong config for local native services (routes to host.docker.internal)
# Usage: docker run with this file mounted instead of kong.yml

services:
  - name: auth-service
    url: http://host.docker.internal:8080/auth
    routes:
      - name: auth-routes
        paths: [/api/v1/auth]
        strip_path: true
        methods: [GET, POST, PUT, DELETE, OPTIONS]

  - name: user-social-service
    url: http://host.docker.internal:3100
    routes:
      - name: user-social-routes
        paths: ["~/api/v1/users/[^/]+/(follow|followers|following|stats)"]
        strip_path: false
        methods: [GET, POST, DELETE, OPTIONS]

  - name: user-service
    url: http://host.docker.internal:8080/users
    routes:
      - name: user-routes
        paths: [/api/v1/users]
        strip_path: true
        methods: [GET, POST, PUT, PATCH, DELETE, OPTIONS]

  - name: posts-service
    url: http://host.docker.internal:3100/api/v1/posts
    routes:
      - name: post-routes
        paths: [/api/v1/posts]
        strip_path: true
        methods: [GET, POST, PUT, DELETE, OPTIONS]

  - name: creator-logos-service
    url: http://host.docker.internal:3100/api/v1/creator-logos
    routes:
      - name: creator-logos-routes
        paths: [/api/v1/creator-logos]
        strip_path: true
        methods: [GET, POST, DELETE, OPTIONS]

  - name: notification-service
    url: http://host.docker.internal:3100/api/v1/notifications
    routes:
      - name: notification-routes
        paths: [/api/v1/notifications]
        strip_path: true
        methods: [GET, POST, PATCH, OPTIONS]

  - name: chat-service
    url: http://host.docker.internal:4000/api/v1/messages
    routes:
      - name: message-routes
        paths: [/api/v1/messages]
        strip_path: true
        methods: [GET, POST, PATCH, DELETE, OPTIONS]

  - name: chat-websocket
    url: http://host.docker.internal:4000
    routes:
      - name: websocket-routes
        paths: [/socket]
        strip_path: false

  - name: media-service
    url: http://host.docker.internal:8081
    routes:
      - name: media-routes
        paths: [/api/v1/media]
        strip_path: false
        methods: [GET, POST, DELETE, OPTIONS]

  - name: content-service
    url: http://host.docker.internal:8081
    routes:
      - name: content-routes
        paths: [/api/v1/content]
        strip_path: false
        methods: [GET, POST, DELETE, OPTIONS]

  - name: otp-service
    url: http://host.docker.internal:8001/otp
    routes:
      - name: otp-routes
        paths: [/api/v1/otp]
        strip_path: true
        methods: [POST, OPTIONS]

  - name: payment-service
    url: http://host.docker.internal:8100/payments
    routes:
      - name: payment-routes
        paths: [/api/v1/payments]
        strip_path: true
        methods: [GET, POST, DELETE, OPTIONS]

  - name: telephony-webhooks
    url: http://host.docker.internal:3109/telephony/webhooks
    routes:
      - name: telephony-webhook-routes
        paths: [/api/v1/telephony/webhooks]
        strip_path: true
        methods: [POST, OPTIONS]

  - name: telephony-service
    url: http://host.docker.internal:3109/telephony
    routes:
      - name: telephony-api-routes
        paths: [/api/v1/telephony]
        strip_path: true
        methods: [GET, POST, PUT, PATCH, DELETE, OPTIONS]
      - name: telephony-ws-routes
        paths: [/telephony/media-stream]
        strip_path: false
        protocols: [http, https]

plugins:
  - name: cors
    config:
      origins: ["*"]
      methods: [GET, POST, PUT, PATCH, DELETE, OPTIONS]
      headers: [Authorization, Content-Type, Accept, X-Request-ID, X-User-ID, X-Twilio-Signature]
      exposed_headers: [X-Request-ID]
      credentials: true
      max_age: 3600

  - name: rate-limiting
    config:
      minute: 120
      hour: 5000
      policy: local
      fault_tolerant: true
      hide_client_headers: false

  - name: correlation-id
    config:
      header_name: X-Request-ID
      generator: uuid
      echo_downstream: true
