# Docker Compose override to connect local services to Railway production databases.
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.prod-db.yml up -d
#   docker compose -f docker-compose.yml -f docker-compose.prod-db.yml --profile services up -d
#
# Production databases used: Postgres (main), Postgres-eE0r (social), MongoDB, Redis
# Local infrastructure kept: Kafka, Zookeeper, Cassandra, Consul, Jaeger, Mailpit, MinIO

