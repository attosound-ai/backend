[project]
name = "payment-service"
version = "0.1.0"
description = "Atto Payment Service - handles transactions and subscriptions"
requires-python = ">=3.12"
license = { text = "MIT" }

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.lint.per-file-ignores]
# FastAPI resolves Depends() in argument defaults by design.
"app/routers/*" = ["B008"]
# gRPC method names follow the proto service definition.
"app/grpc/server.py" = ["N802"]
# str enums are stored by value and the PyUUID alias avoids clashing with the SQLAlchemy type.
"app/models/*" = ["UP042", "N811"]
"app/entitlements.py" = ["UP042"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
